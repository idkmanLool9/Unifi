name: Deploy to GitHub Pages

on:
  push:
    # Deploy from main once it exists; until then the working branch is
    # the repository's default branch and deploys directly.
    branches:
      - main
      - claude/rackforge-project-setup-4on0nn
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let in-flight production deploys finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Project sites are served at /<repository-name>/ — derive it so
          # a repository rename can never break the base path.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # While Pages is in "Deploy from a branch" mode, GitHub's built-in
      # Jekyll pipeline races this workflow on every push and publishes the
      # raw source tree (a blank page for a Vite app) whenever it finishes
      # last. Switch the site to workflow deployments so only this
      # workflow's artifact is ever published.
      - name: Ensure Pages deploys from Actions (not a branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${{ github.repository }}/pages" \
            -f build_type=workflow \
            || echo "::warning::Could not switch Pages to workflow deployments automatically. Set Settings → Pages → Source to 'GitHub Actions' manually."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
